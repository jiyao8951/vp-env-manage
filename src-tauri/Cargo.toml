[package]
name = "flowdeck"
version = "0.1.0"
description = "FlowDeck - 桌面端 Vite+ 环境管理器"
authors = ["FlowDeck"]
edition = "2021"
rust-version = "1.77.2"
# 使用 v1 feature 解析器：让 build-dependencies 与常规依赖共享 feature，
# 下面的 indexmap 兼容修复才能同时作用于 tauri-build 链路。
resolver = "1"

[lib]
name = "flowdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必须启用：tauri-macros 里 `dev = cfg!(not(feature = "custom-protocol"))`，
# 没启用时 generate_context! 会走 devUrl（localhost:1520）而不把 dist 嵌进 exe，
# 打包出来的程序没有 dev server 可连，窗口就是一片空白。DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.8.0"
# 单实例：重复启动时聚焦已有窗口，而不是再起一个实例
tauri-plugin-single-instance = "2.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
# 版本约束语义：区分 `>=26.13.0` 这类范围与 `26.13.0` 这类具体版本，
# 避免把不同来源的 pin 误判成冲突（依赖已随 tauri 链进入 Cargo.lock）
semver = "1.0.28"

# 兼容修复：tauri 依赖的 schemars 0.8.22 会引入 indexmap 1.x，但没有开启它的
# `std` feature，导致其内部 `IndexMap<K, V>` 缺少默认的第三个泛型参数而无法编译。
# 这里显式开启 `std`，配合 cargo 的 feature 统一修复该上游问题（代码中不直接使用）。
indexmap = { version = "1.9", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
